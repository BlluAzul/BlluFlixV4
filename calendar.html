<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO Meta Tags -->
    <title>Calendário de Lançamentos - BlluFlix</title>
    <meta name="description"
        content="Veja os próximos lançamentos de séries e animes no BlluFlix. Calendário atualizado em tempo real.">
    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/cinema.css?v=24">

    <style>
        .calendar-page {
            min-height: 100vh;
            background: var(--bg-primary);
            padding: var(--spacing-xl);
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-button:hover {
            background: var(--accent-primary);
            transform: translateX(-5px);
        }

        .back-button svg {
            width: 20px;
            height: 20px;
        }

        .calendar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding-top: 60px;
        }

        .calendar-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .calendar-header h1 {
            font-size: 2.5rem;
            margin-bottom: var(--spacing-md);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .calendar-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .calendar-section {
            margin-bottom: var(--spacing-2xl);
        }

        .section-title-calendar {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--border-color);
        }

        .section-title-calendar .count {
            font-size: 0.9rem;
            padding: 4px 12px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .releases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-lg);
        }

        .release-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .release-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .release-card-image {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .release-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .release-card:hover .release-card-image img {
            transform: scale(1.1);
        }

        .release-status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
        }

        .status-today {
            background: rgba(239, 68, 68, 0.9);
            color: white;
        }

        .status-future {
            background: rgba(59, 130, 246, 0.9);
            color: white;
        }

        .status-updated {
            background: rgba(34, 197, 94, 0.9);
            color: white;
        }

        .status-late {
            background: rgba(245, 158, 11, 0.9);
            color: white;
        }

        .release-card-content {
            padding: var(--spacing-md);
        }

        .release-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .release-episode {
            color: var(--accent-primary);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: var(--spacing-xs);
        }

        .release-episode-title {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: var(--spacing-sm);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .release-date {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .release-date svg {
            width: 14px;
            height: 14px;
        }

        .empty-section {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-muted);
        }

        .empty-section svg {
            width: 64px;
            height: 64px;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .calendar-page {
                padding: var(--spacing-md);
            }

            .calendar-header h1 {
                font-size: 1.8rem;
            }

            .releases-grid {
                grid-template-columns: 1fr;
            }

            .back-button {
                top: 10px;
                left: 10px;
                padding: 10px 16px;
            }
        }
    </style>
</head>

<body>
    <!-- Back Button -->
    <a href="index.html" class="back-button" onclick="goBack(event)">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
        <span>Voltar</span>
    </a>

    <script>
        function goBack(e) {
            if (e) e.preventDefault();
            if (window.history.length > 1 && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>

    <!-- Calendar Page -->
    <div class="calendar-page" id="calendar-page">
        <div class="loading-container"
            style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px;">
            <div class="spinner"></div>
            <p style="color: var(--text-secondary);">Carregando calendário de lançamentos...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/calendar.js"></script>

    <script>
        // Initialize calendar page
        document.addEventListener('DOMContentLoaded', async () => {
            // FLAG-BASED STATE MANAGEMENT (more reliable than referrer)
            const isReturning = sessionStorage.getItem('calendar_navigated') === 'true';

            // Clear navigation flag after reading
            sessionStorage.removeItem('calendar_navigated');

            if (!isReturning) {
                // Reset state if NOT returning from a detail page
                sessionStorage.removeItem('calendar_counts');
                sessionStorage.removeItem('calendar_scroll');
            }

            // NOW load the counts (after potential reset)
            initDisplayedCounts();

            await loadCalendar();

            // Restore scroll if applicable
            if (isReturning) {
                const savedScroll = sessionStorage.getItem('calendar_scroll');
                if (savedScroll) {
                    // Delay to ensure rendering is complete
                    setTimeout(() => {
                        window.scrollTo({
                            top: parseInt(savedScroll),
                            behavior: 'instant'
                        });
                    }, 150);
                }
            }
        });

        async function loadCalendar() {
            const container = document.getElementById('calendar-page');

            try {
                const releasesByStatus = await calendarAPI.getReleasesByStatus();

                container.innerHTML = `
          <div class="calendar-container">
            <div class="calendar-header">
              <h1>📅 Calendário de Lançamentos</h1>
              <p>Acompanhe os próximos episódios de séries e animes</p>
            </div>
            
            ${renderSection('Hoje', releasesByStatus['Hoje'], '🔥')}
            ${renderSection('Futuro', releasesByStatus['Futuro'], '📅')}
            ${renderSection('Atualizado', releasesByStatus['Atualizado'], '✅')}
            ${renderSection('Atrasado', releasesByStatus['Atrasado'], '⏰')}
            
            <!-- Footer -->
            <footer class="footer" style="margin-top: var(--spacing-2xl);">
              <div class="footer-content">
                <div class="footer-logo">BlluFlix</div>
                <div class="footer-links">
                  <a href="index.html" class="footer-link">Início</a>
                  <a href="#" class="footer-link">DMCA</a>
                  <a href="information.html" class="footer-link">Informação</a>
                </div>
                <p class="footer-text">
                  Assista filmes e séries online grátis.
                </p>
                <p class="footer-text" style="margin-top: 20px; font-size: 0.8rem;">
                  © 2026 BlluFlix. Este site não armazena nenhum conteúdo em seus servidores.
                </p>
              </div>
            </footer>
          </div>
        `;
            } catch (error) {
                console.error('Erro ao carregar calendário:', error);
                container.innerHTML = `
          <div class="calendar-container">
            <div class="calendar-header">
              <h1>📅 Calendário de Lançamentos</h1>
            </div>
            <div class="empty-section">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
              </svg>
              <h3>Não foi possível carregar o calendário</h3>
              <p>Tente novamente mais tarde.</p>
              <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">Voltar ao Início</a>
            </div>
          </div>
        `;
            }
        }

        // Store full lists of items per section
        const releaseItems = {
            'Hoje': [],
            'Futuro': [],
            'Atualizado': [],
            'Atrasado': []
        };

        // Track displayed count per section - MUST be read AFTER reset logic runs
        // We use a variable that will be set by loadCalendar
        let displayedCounts = {
            'Hoje': 10,
            'Futuro': 10,
            'Atualizado': 10,
            'Atrasado': 10
        };

        // Function to load counts from storage (called after reset decision is made)
        function initDisplayedCounts() {
            const savedCounts = sessionStorage.getItem('calendar_counts');
            if (savedCounts) {
                displayedCounts = JSON.parse(savedCounts);
            }
        }

        function renderSection(status, items, icon) {
            if (!items || items.length === 0) {
                return '';
            }

            // Store items for "Load More" logic
            releaseItems[status] = items;

            const statusConfig = {
                'Hoje': { class: 'status-today', label: 'Hoje' },
                'Futuro': { class: 'status-future', label: 'Em Breve' },
                'Atualizado': { class: 'status-updated', label: 'Atualizado' },
                'Atrasado': { class: 'status-late', label: 'Atrasado' }
            };

            const config = statusConfig[status] || statusConfig['Atualizado'];
            const initialCount = displayedCounts[status];
            const itemsToShow = items.slice(0, initialCount);
            const hasMore = items.length > initialCount;

            return `
        <section class="calendar-section" id="section-${status}">
          <h2 class="section-title-calendar">
            ${icon} ${status === 'Hoje' ? 'Lançamentos de Hoje' : status === 'Futuro' ? 'Próximos Lançamentos' : status === 'Atualizado' ? 'Recentemente Atualizados' : 'Episódios Atrasados'}
            <span class="count">${items.length} ${items.length === 1 ? 'título' : 'títulos'}</span>
          </h2>
          <div class="releases-grid" id="grid-${status}">
            ${itemsToShow.map(item => renderReleaseCard(item, config)).join('')}
          </div>
          ${hasMore ? `
            <div class="load-more-container" style="text-align: center; margin-top: 20px;">
              <button class="btn btn-primary" id="btn-${status}" onclick="loadMore('${status}')">Ver Mais</button>
            </div>
          ` : ''}
        </section>
      `;
        }

        function loadMore(status) {
            const currentCount = displayedCounts[status];
            const allItems = releaseItems[status];
            const nextCount = currentCount + 10;
            const nextItems = allItems.slice(currentCount, nextCount);

            const statusConfig = {
                'Hoje': { class: 'status-today', label: 'Hoje' },
                'Futuro': { class: 'status-future', label: 'Em Breve' },
                'Atualizado': { class: 'status-updated', label: 'Atualizado' },
                'Atrasado': { class: 'status-late', label: 'Atrasado' }
            };

            const config = statusConfig[status] || statusConfig['Atualizado'];
            const grid = document.getElementById(`grid-${status}`);

            // Append new items
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = nextItems.map(item => renderReleaseCard(item, config)).join('');
            while (tempDiv.firstChild) {
                grid.appendChild(tempDiv.firstChild);
            }

            // Update count
            displayedCounts[status] = nextCount;
            sessionStorage.setItem('calendar_counts', JSON.stringify(displayedCounts));

            // Hide button if no more items
            if (nextCount >= allItems.length) {
                const btn = document.getElementById(`btn-${status}`);
                if (btn) btn.style.display = 'none';
            }
        }

        function renderReleaseCard(item, statusConfig) {
            // Fix: API uses 'poster' and 'backdrop', not '_path' suffixes
            const posterUrl = item.backdrop || item.poster
                ? calendarAPI.getPosterUrl(item.backdrop || item.poster)
                : 'https://via.placeholder.com/400x225/1a1a25/6b6b7b?text=' + encodeURIComponent(item.title || 'Sem Título');

            const tmdbId = item.tmdb_id || '';
            const seasonNumber = item.season || 1;
            const episodeNumber = item.number || 1;

            // Handle episode title - show only if it provides unique info (not just "Episódio X")
            let episodeTitle = '';
            // Check if item.episode exists and is not just "Episódio [number]"
            if (item.episode && !item.episode.match(/^Episódio \d+$/)) {
                episodeTitle = `<p class="release-episode-title">${item.episode}</p>`;
            }

            return `
        <div class="release-card" onclick="goToSeries('${tmdbId}')">
          <div class="release-card-image">
            <img src="${posterUrl}" alt="${item.title || 'Episódio'}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x225/1a1a25/6b6b7b?text=Sem+Imagem'">
            <span class="release-status-badge ${statusConfig.class}">${statusConfig.label}</span>
          </div>
          <div class="release-card-content">
            <h3 class="release-title">${item.title || 'Título Desconhecido'}</h3>
            <p class="release-episode">Temporada ${seasonNumber} • Episódio ${episodeNumber}</p>
            ${episodeTitle}
            <div class="release-date">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/>
              </svg>
              <span>${calendarAPI.formatDate(item.air_date)}</span>
            </div>
          </div>
        </div>
      `;
        }

        function goToSeries(tmdbId) {
            if (tmdbId && tmdbId !== '' && tmdbId !== 'undefined' && tmdbId !== 'null') {
                // Set flag indicating we're navigating away (for state restoration)
                sessionStorage.setItem('calendar_navigated', 'true');
                // Save scroll position before navigating
                sessionStorage.setItem('calendar_scroll', window.scrollY.toString());
                window.location.href = `series.html?id=${tmdbId}`;
            } else {
                // No valid ID - just show a message or do nothing
                console.warn('Item sem ID válido');
            }
        }
    </script>
  <script src="assets/js/cinema.js?v=24" defer></script>
</body>

</html>
